<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Ôn Tập Từ Vựng Tiếng Anh</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Quicksand:wght@600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-gradient: white;
            --card-border: #b12b2b;
            --card-hover-border: rgba(243, 33, 33, 0.25);
            --text-main: #122233;
            --text-sub: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            color: var(--text-main);
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient glowing circles */
        .glow-1 {
            position: absolute;
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, rgba(255, 117, 140, 0.25) 0%, rgba(255, 117, 140, 0) 70%);
            top: -80px;
            left: -80px;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(40px);
        }

        .glow-2 {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.2) 0%, rgba(56, 189, 248, 0) 70%);
            bottom: -100px;
            right: -100px;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(45px);
        }

        .main-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 860px;
            text-align: center;
        }

        .badge-header {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px 16px;
            border-radius: 999px;
            font-size: 0.85rem;
            color: #38bdf8;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
            backdrop-filter: blur(8px);
        }

        h1.main-title {
            font-size: clamp(2rem, 4vw, 2.75rem);
            font-weight: 800;
            letter-spacing: -0.5px;
            background: #122233;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        p.description {
            color: var(--text-sub);
            font-size: 1.05rem;
            max-width: 580px;
            margin: 0 auto 40px auto;
            line-height: 1.6;
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
        }

        .nav-card {
            background: rgb(8, 109, 140);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 32px 28px;
            text-align: left;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(12px);
        }

        .nav-card::before {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        /* Card 1: Colorful version */
        .card-colorful {
            box-shadow: 0 10px 30px rgba(255, 117, 140, 0.08);
        }

        .card-colorful::before {
            background: radial-gradient(800px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255, 117, 140, 0.15), transparent 40%);
        }

        .card-colorful:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 117, 140, 0.5);
            box-shadow: 0 20px 40px rgba(255, 117, 140, 0.2);
        }

        /* Card 2: Simple version */
        .card-simple {
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.08);
        }

        .card-simple::before {
            background: radial-gradient(800px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(56, 189, 248, 0.15), transparent 40%);
        }

        .card-simple:hover {
            transform: translateY(-6px);
            border-color: rgba(56, 189, 248, 0.5);
            box-shadow: 0 20px 40px rgba(56, 189, 248, 0.2);
        }

        .card-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin-bottom: 22px;
        }

        .card-colorful .card-icon {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            box-shadow: 0 8px 20px rgba(255, 117, 140, 0.35);
        }

        .card-simple .card-icon {
            background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.35);
        }

        .card-tag {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 4px 10px;
            border-radius: 6px;
            margin-bottom: 12px;
        }

        .card-colorful .card-tag {
            background: rgba(255, 117, 140, 0.15);
            color: #ff94a8;
        }

        .card-simple .card-tag {
            background: rgba(56, 189, 248, 0.15);
            color: #7dd3fc;
        }

        .card-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            line-height: 1.35;
        }

        .card-subtitle {
            font-size: 0.95rem;
            color: var(--text-sub);
            margin-bottom: 26px;
            line-height: 1.5;
        }

        .card-action {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.95rem;
            font-weight: 700;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .card-colorful .card-action span {
            color: #ff8ca3;
        }

        .card-simple .card-action span {
            color: #38bdf8;
        }

        .arrow-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.08);
            transition: transform 0.25s ease, background 0.25s ease;
        }

        .nav-card:hover .arrow-circle {
            transform: translateX(4px);
            background: rgba(255, 255, 255, 0.18);
        }

        footer {
            margin-top: 45px;
            font-size: 0.85rem;
            color: #64748b;
        }
    </style>
</head>

<body>
    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <main class="main-wrapper">
        <div class="badge-header">
            <span>✨</span> Chọn Phiên Bản Học Tập
        </div>
        <h1 class="main-title">Ôn Tập Từ Vựng Tiếng Anh</h1>
        <p class="description">
            Lựa chọn giao diện ôn tập phù hợp với sở thích của bạn để bắt đầu làm bài trắc nghiệm ngay.
        </p>

        <div class="nav-grid">
            <!-- Phiên bản 1: Ôn Tập Tiếng Anh Ngành Giày -->
            <a href="colorfulver-englishvocab.html" class="nav-card card-colorful" id="btn-colorful">
                <div>
                    <div class="card-icon">👟</div>
                    <h2 class="card-title">Ôn Tập Tiếng Anh Ngành Giày</h2>
                </div>
                <div class="card-action">
                    <span>Bắt đầu ôn tập</span>
                    <div class="arrow-circle">➔</div>
                </div>
            </a>

            <!-- Phiên bản 2: Trắc Nghiệm Từ Vựng Tiếng Anh -->
            <a href="simplecolorver-engvocab.html" class="nav-card card-simple" id="btn-simple">
                <div>
                    <div class="card-icon">📝</div>
                    <h2 class="card-title">Trắc Nghiệm Từ Vựng Tiếng Anh</h2>

                </div>
                <div class="card-action">
                    <span>Bắt đầu trắc nghiệm</span>
                    <div class="arrow-circle">➔</div>
                </div>
            </a>
        </div>

        <footer>
        </footer>
    </main>

    <script>
        // Mouse follow effect on cards
        document.querySelectorAll('.nav-card').forEach(card => {
            card.addEventListener('mousemove', e => {
                const rect = card.getBoundingClientRect();
                card.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
                card.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
            });
        });
    </script>
</body>

</html>
